<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevated Design Co</title>
<meta name="description" content="Elevated Design Co: printable designs on Etsy.">
<style>
  :root { --ink:#2b2622; --muted:#6f665e; --bg:#faf7f2; --line:#e6dfd5; --accent:#2b2622; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width:620px; margin:0 auto; padding:72px 20px; text-align:center; }
  h1 { font-weight:normal; font-size:34px; letter-spacing:.04em; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 32px; }
  a.shop { display:inline-block; padding:14px 30px; border:1px solid var(--accent); color:var(--accent); text-decoration:none; letter-spacing:.08em; text-transform:uppercase; font-size:14px; }
  a.shop:hover { background:var(--accent); color:var(--bg); }
  footer { margin-top:72px; padding-top:20px; border-top:1px solid var(--line); font-size:14px; }
  footer a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Elevated Design Co</h1>
  <p>Thoughtfully designed pieces, available in our Etsy shop.</p>
  <a class="shop" href="https://www.etsy.com/shop/ElevatedDesignShopCo">Visit our Etsy shop</a>
  <footer><a href="privacy.html">Privacy policy</a></footer>
</main>
</body>
</html>
